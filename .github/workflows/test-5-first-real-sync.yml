name: Test 5 - First Real Drive Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchtech-drive-sync
  cancel-in-progress: false

jobs:
  drive-sync:
    runs-on: ubuntu-latest

    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth

      - name: Run first real synchronization
        run: |
          python .github/scripts/drive_sync.py

      - name: Show synchronization changes
        run: |
          echo "========================================"
          echo "GIT CHANGES"
          echo "========================================"
          git status --short

      - name: Commit synchronized documents and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs .github/sync-state.json

          if git diff --cached --quiet; then
            echo "No synchronization changes to commit."
            exit 0
          fi

          git commit -m "Sync WatchTech Docs from Google Drive"
          git push
