name: WatchTech Drive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: watchtech-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Synchronize WatchTech Docs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/drive_sync.py

      - name: Show synchronization changes
        run: |
          echo '========================================'
          echo 'GIT CHANGES'
          echo '========================================'
          git status --short
          echo '========================================'

      - name: Commit and push synchronized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs .github/sync-state.json

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Sync WatchTech Docs from Google Drive'
            git push
          fi
