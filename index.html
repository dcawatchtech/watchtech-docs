<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#17202a">

    <title>WatchTech Docs</title>

    <link rel="stylesheet"
          href="style.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client"
            async
            defer></script>
</head>

<body>

<header>

    <div class="header-content">

        <div>
            <div class="logo">
                ⌚ WatchTech Docs
            </div>

            <div class="subtitle">
                Watch Technician Documentation Library
            </div>
        </div>

        <button class="sync-button"
                id="googleSignInButton">
            🔐 Sign in with Google
        </button>

    </div>

</header>


<main>

    <div id="userInfo"
         style="display:none; margin-bottom:20px;">
    </div>


    <input
        type="search"
        id="search"
        class="search-box"
        placeholder="🔎 Search documents..."
        oninput="searchDocuments()"
    >


    <div id="library"
         class="library">
    </div>

    <div id="breadcrumbs"></div>

    <div id="library"></div>

    <button id="backButton">
            ← Back
        </button>

<div id="breadcrumbs"></div>

<div id="library"></div>

    <div class="status">

        <strong>Library status</strong>

        <p id="connectionStatus">
            ● Waiting for Google authentication
        </p>

        <p>
            Google Drive:
            <strong id="driveStatus">
                Not connected
            </strong>
        </p>

    </div>

</main>


<script src="app.js"></script>

</body>
</html>
