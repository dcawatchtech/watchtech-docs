<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"  content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#17202a">

    <title>WatchTech Docs</title>

    <link rel="stylesheet"  href="style.css">
</head>

<body>

<header>

    <div class="header-content">

        <div>
            <div class="logo">
                ⌚ WatchTech Docs
            </div>

            <div class="subtitle">
                Watch Technician Documentation Library
            </div>
        </div>

        <button class="sync-button"
                onclick="syncLibrary()">
            🔄 Sync
        </button>

    </div>

</header>


<main>

    <input
        type="search"
        id="search"
        class="search-box"
        placeholder="🔎 Search documents..."
        oninput="searchDocuments()"
    >


    <div id="library"
         class="library">

        <!-- Library will be generated by JavaScript -->

    </div>


    <div class="status">

        <strong>Library status</strong>

        <p class="status-online">
            ● Application online
        </p>

        <p>
            Google Drive synchronization:
            <strong>Not connected yet</strong>
        </p>

    </div>

</main>


<script src="app.js"></script>

</body>
</html>
